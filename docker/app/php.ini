; Quiz app overrides on top of php.ini-production.
; Uploads are PNG only at 10 MB (spec section 4.4). post_max_size must exceed
; upload_max_filesize to leave room for the CSRF token and the other form fields.
upload_max_filesize = 10M
post_max_size = 14M
memory_limit = 256M
max_file_uploads = 5

; Now that a php.ini exists, stop advertising the exact PHP build in the
; X-Powered-By response header.
expose_php = Off
